name: Risk Monitor Pipeline

"on":
  schedule:
    - cron: '0,30 3-10 * * 1-5' 
  workflow_dispatch:

jobs:
  run-risk-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run risk pipeline
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
        run: python main.py

      - name: Upload run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-run-${{ github.run_number }}
          path: logs/
          retention-days: 30
